services:
  web:
    build: .
    ports:
      - "${ORANGE_WEB_BIND_IP:-0.0.0.0}:8000:8000"
    env_file:
      - .env.docker
    command: >
      sh -c "python init_db.py && gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 900 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    volumes:
      - ./webapp/uploads:/app/webapp/uploads
      - ./licencia:/app/licencia:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${ORANGE_DB_USER:-orange_user}
      POSTGRES_PASSWORD: ${ORANGE_DB_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${ORANGE_DB_NAME:-orange_poliza}
    ports:
      - "${ORANGE_DB_BIND_IP:-127.0.0.1}:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: "${ORANGE_PG_VOLUME:-orange-poliza-engine-copia_postgres_data}"
